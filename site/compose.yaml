name: benlovesmolly

services:
 web:
  build: ./web
  read_only: true
  tmpfs:
   - /tmp
  cap_drop:
   - ALL
  security_opt:
   - no-new-privileges:true
  restart: unless-stopped

 cloudflared:
  image: cloudflare/cloudflared:2026.10.1
  command: tunnel --no-autoupdate run
  environment:
   TUNNEL_TOKEN: ${TUNNEL_TOKEN}
  depends_on:
   - web
  restart: unless-stopped
