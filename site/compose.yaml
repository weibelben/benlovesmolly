name: benlovesmolly

services:
 web:
  build:
   context: ./web
   # The guest list lives outside the web context, in the private submodule.
   additional_contexts:
    invitees: ../configs/benlovesmolly-private
  environment:
   SITE_PASSWORD_HASH: ${SITE_PASSWORD_HASH}
  read_only: true
  tmpfs:
   - /tmp
   # nginx writes its config here at start-up; see web/nginx.conf.
   - /etc/nginx/conf.d:uid=101,gid=101
  cap_drop:
   - ALL
  security_opt:
   - no-new-privileges:true
  restart: unless-stopped

 cloudflared:
  image: cloudflare/cloudflared:2026.10.4@sha256:c6c7ae1d5dfdcb094ad344ed68ccffc26635c9c6be80965664c33baf064b0515
  command: tunnel --no-autoupdate run
  environment:
   TUNNEL_TOKEN: ${TUNNEL_TOKEN}
  read_only: true
  cap_drop:
   - ALL
  security_opt:
   - no-new-privileges:true
  depends_on:
   - web
  restart: unless-stopped
