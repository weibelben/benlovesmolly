# Rendered at container start by the image's envsubst step, which fills in
# SITE_PASSWORD_HASH from the environment.

# A visitor is let in when their blm_auth cookie holds the SHA-256 of the site
# password. The password page sets that cookie; see src/pages/password.astro.
# The bucket size has to fit the 64-character hash.
map_hash_bucket_size 128;
map $cookie_blm_auth $authed {
  "${SITE_PASSWORD_HASH}" 1;
  default 0;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  absolute_redirect off;

  # Visitors without the cookie get the password page in place of whatever
  # they asked for, so the URL is unchanged once they're let in.
  error_page 401 /password/index.html;
  error_page 404 /404.html;

  location = /password/index.html {
    add_header Cache-Control "no-store" always;
  }

  # Styles, fonts and scripts the password page needs before login.
  location ~ ^/_astro/[^/]+\.(css|js|woff2?)$ {
  }

  location = /favicon.svg {
  }

  # The RSVP API, behind the same password as the pages.
  location /api/ {
    if ($authed = 0) {
      return 401;
    }
    client_max_body_size 16k;
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
  }

  location / {
    if ($authed = 0) {
      return 401;
    }
    # Keep Cloudflare from caching gated pages and photos at the edge, where
    # they could be served to visitors who never logged in.
    add_header Cache-Control "private" always;
    try_files $uri $uri/ $uri.html =404;
  }
}
