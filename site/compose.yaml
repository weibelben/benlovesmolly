name: benlovesmolly

services:
 web:
  build: ./web
  environment:
   SITE_PASSWORD_HASH: ${SITE_PASSWORD_HASH}
  read_only: true
  tmpfs:
   - /tmp
   # nginx writes its config here at start-up; see web/nginx.conf.
   - /etc/nginx/conf.d:uid=101,gid=101
  cap_drop:
   - ALL
  security_opt:
   - no-new-privileges:true
  restart: unless-stopped

 cloudflared:
  image: cloudflare/cloudflared:2026.10.1
  command: tunnel --no-autoupdate run
  environment:
   TUNNEL_TOKEN: ${TUNNEL_TOKEN}
  read_only: true
  cap_drop:
   - ALL
  security_opt:
   - no-new-privileges:true
  depends_on:
   - web
  restart: unless-stopped
